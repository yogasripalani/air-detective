<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Detective</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; background:#f4f7fa; margin:0; color:#1b2a38; }
  header { background:#0b3d5c; color:#fff; padding:20px; text-align:center; }
  main { max-width:820px; margin:20px auto; padding:0 16px; }
  .controls { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  input, button { padding:10px 12px; font-size:16px; border-radius:6px; border:1px solid #b8c4ce; }
  button { background:#0b7a5c; color:#fff; border:none; cursor:pointer; }
  button:disabled { background:#8aa; cursor:wait; }
  .card { background:#fff; border-radius:10px; padding:18px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .badge { display:inline-block; padding:4px 10px; border-radius:20px; font-weight:600; color:#fff; }
  .bad { background:#c0392b; } .ok { background:#27ae60; }
  .warn { background:#e67e22; }
  .note { font-size:13px; color:#5b6b79; }
  #error { color:#c0392b; }
</style>
</head>
<body>
<header>
  <h1>Air Detective</h1>
  <div>Why did the air quality change? Pick a city and date.</div>
</header>
<main>
  <div class="controls">
    <input id="city" value="Chennai" placeholder="City">
    <input id="date" type="date">
    <button id="go">Investigate</button>
  </div>
  <p id="error"></p>
  <div id="report" class="card" hidden>
    <h2 id="headline"></h2>
    <span id="badge" class="badge"></span>
    <h3>Evidence</h3>
    <ul id="evidence"></ul>
      <h3>Where: PM2.5 on this date (µg/m³)</h3>
    <ul id="areas"></ul>
    <p class="note">These findings are correlations that coincided with the change, not proven causes. Data: Open-Meteo (model-based estimates).</p>
  </div>
  <div id="chartCard" class="card" hidden>
    <canvas id="chart" height="120"></canvas>
  </div>
</main>

<script>
const API_URL = "https://zmrp4vw8xb.execute-api.ap-south-1.amazonaws.com"; // <- put your Invoke URL here

const d = new Date(); d.setDate(d.getDate() - 10);
document.getElementById("date").value = d.toISOString().slice(0, 10);

let chart;
document.getElementById("go").addEventListener("click", async () => {
  const city = document.getElementById("city").value.trim();
  const date = document.getElementById("date").value;
  const btn = document.getElementById("go");
  const err = document.getElementById("error");
  err.textContent = "";
  btn.disabled = true; btn.textContent = "Investigating...";
  try {
    const res = await fetch(`${API_URL}/investigate?city=${encodeURIComponent(city)}&date=${date}`);
    if (!res.ok) throw new Error("No data for that city/date. Try an older date or check the spelling.");
    show(await res.json());
  } catch (e) {
    err.textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = "Investigate";
  }
});

function show(r) {
  const pct = Math.round(((r.pm25 - r.baseline) / r.baseline) * 100);
  const dir = pct >= 0 ? "above" : "below";
    document.getElementById("headline").textContent =
    `${r.place || r.city}, ${r.date}: PM2.5 was ${r.pm25} µg/m³, ${Math.abs(pct)}% ${dir} the 28-day average (${r.baseline}).`;
  const badge = document.getElementById("badge");
    const elevated = !r.anomaly && r.zscore >= 1;
  badge.textContent = r.anomaly ? "Unusual change detected"
                    : elevated ? "Elevated, within normal variation"
                    : "Within normal range";
  badge.className = "badge " + (r.anomaly ? "bad" : elevated ? "warn" : "ok");

  const ul = document.getElementById("evidence");
  ul.innerHTML = "";
  const items = r.evidence.length ? r.evidence : ["No clear weather-related shift found for this date."];
  items.forEach(t => { const li = document.createElement("li"); li.textContent = t; ul.appendChild(li); });

  const labels = Object.keys(r.series);
    const al = document.getElementById("areas");
  al.innerHTML = "";
  Object.entries(r.areas || {}).forEach(([place, v]) => {
    const li = document.createElement("li");
    li.textContent = (place === "Centre" ? "City centre" : place + " (about 55 km)") + ": " + v;
    al.appendChild(li);
  });
  const values = Object.values(r.series);
  const colors = labels.map(l => l === r.date ? "#c0392b" : "#0b7a5c");
  const sizes = labels.map(l => l === r.date ? 8 : 3);
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: { labels, datasets: [
      { label: "Daily PM2.5 (µg/m³)", data: values, borderColor: "#0b7a5c",
        pointBackgroundColor: colors, pointRadius: sizes, tension: 0.25 },
      { label: "28-day average", data: labels.map(() => r.baseline),
        borderColor: "#999", borderDash: [6, 6], pointRadius: 0 }
    ]}
  });
  document.getElementById("report").hidden = false;
  document.getElementById("chartCard").hidden = false;
}
</script>
</body>
</html>
